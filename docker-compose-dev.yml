services:
  orq:
    build:
      context: ./maestro-orq
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./maestro-orq:/usr/src/app:z
      - maestro-orq-dev-data:/data:Z
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/run/podman/podman.sock
    environment:
      MODE: dev # skips real logsad.com session checks, see internal/api.DevSession
      MAESTRO_ORQ_ADDR: :8081
      MAESTRO_ORQ_DB: /data/maestro-orq.db
      ALLOWED_ORIGINS: http://localhost:8080
      PODMAN_SOCKET: unix:///run/podman/podman.sock
      BUILD_TIMEOUT: 30m
    ports:
      - "8081:8081"

  # builds maestro-view into ./maestro-view/dist and exits - use `npm run dev` for live reload
  view:
    build:
      context: ./maestro-view
      dockerfile: Dockerfile
    environment:
      VITE_ORQ_URL: http://localhost:8081
      VITE_LOGIN_URL: https://logsad.com
    volumes:
      - ./maestro-view/dist:/app/dist

volumes:
  maestro-orq-dev-data:
