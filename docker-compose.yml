services:
  orq:
    build:
      context: ./maestro-orq
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    volumes:
      - maestro-orq-data:/data:Z
      # What runs leave behind: <user>/<run>/<line>/<file>
      - maestro-orq-runs:/maestro/data:Z
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/run/podman/podman.sock
    environment:
      MODE: prod
      MAESTRO_ORQ_ADDR: :3005
      MAESTRO_ORQ_DB: /data/maestro-orq.db
      ALLOWED_ORIGINS: https://maestro.logsad.com
      PODMAN_SOCKET: unix:///run/podman/podman.sock
      BUILD_TIMEOUT: 30m
      REDIS_URL: ${REDIS_URL}
      VIEW_URL: https://maestro.logsad.com
      # The one identity provider this deployment trusts; values come from .env
      # (see .env.example). Any OpenID Connect provider works.
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL}
      # Checked again here even though the provider already enforces it.
      OIDC_ALLOWED_ROLES: LOGGER,ADMIN
      # Users with this role manage the machines containers run on.
      OIDC_ADMIN_ROLES: ADMIN
      MACHINE_SECRET: ${MACHINE_SECRET}
    ports:
      - "3005:3005"

  # builds maestro-view into ./maestro-view/dist and exits; Caddy serves that
  # directory directly, so no port/restart policy is needed here.
  view:
    build:
      context: ./maestro-view
      dockerfile: Dockerfile
    environment:
      VITE_ORQ_URL: https://maestro.logsad.com
      VITE_IDP_NAME: LOGSAD
    volumes:
      - ./maestro-view/dist:/app/dist

volumes:
  maestro-orq-data:
  maestro-orq-runs:
