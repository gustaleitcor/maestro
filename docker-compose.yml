services:
  orq:
    build:
      context: ./maestro-orq
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    volumes:
      - maestro-orq-data:/data:Z
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/run/podman/podman.sock
    environment:
      MODE: prod
      MAESTRO_ORQ_ADDR: :8081
      MAESTRO_ORQ_DB: /data/maestro-orq.db
      ALLOWED_ORIGINS: https://maestro.logsad.com
      PODMAN_SOCKET: unix:///run/podman/podman.sock
      BUILD_TIMEOUT: 30m
    ports:
      - "8081:8081"

  # builds maestro-view into ./maestro-view/dist and exits; Caddy serves that
  # directory directly, so no port/restart policy is needed here.
  view:
    build:
      context: ./maestro-view
      dockerfile: Dockerfile
    environment:
      VITE_ORQ_URL: https://maestro.logsad.com
      VITE_LOGIN_URL: https://logsad.com
    volumes:
      - ./maestro-view/dist:/app/dist

volumes:
  maestro-orq-data:
